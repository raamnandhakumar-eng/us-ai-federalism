name: live pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pilot.yml

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch primary sources
        run: |
          uaf fetch-sources --limit 3
          uaf validate-sources

      - name: Enforce pilot budget
        run: |
          uaf estimate-cost --limit 3 > /tmp/cost.json
          python - <<'PY'
          import json
          from pathlib import Path

          estimate = json.loads(Path("/tmp/cost.json").read_text())
          ceiling = 1.0
          if estimate["usd"] > ceiling:
              raise SystemExit(
                  f"Estimated cost ${estimate['usd']:.4f} exceeds ${ceiling:.2f} pilot ceiling"
              )
          with Path("/tmp/cost.json").open("a") as handle:
              handle.write("\n")
          print(f"Preflight passed: ${estimate['usd']:.4f} <= ${ceiling:.2f}")
          PY

      - name: Code pilot laws
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not configured" >&2
            exit 1
          fi
          uaf code-laws \
            --limit 3 \
            --max-spend 1.00 \
            --output data/processed/codings_unreviewed.csv

      - name: Build run manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "model": "claude-haiku-4-5-20251001",
              "pilot_law_limit": 3,
              "hard_cost_ceiling_usd": 1.0,
              "review_status": "unreviewed",
          }
          path = Path("data/processed/run_manifest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload unreviewed pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-pilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/cost.json
            data/interim/source_receipts/*.json
            data/processed/codings_unreviewed.csv
            data/processed/codings_unreviewed_usage.csv
            data/processed/run_manifest.json
